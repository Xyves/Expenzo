name: CI Pipeline

on:
  push:
    branches:
      - main
      - '*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint with ESLint
        run: npm run eslint

      - name: Format with Prettier
        run: npm run prettier

      - name: Type Check
        run: npm run check:types

      - name: Run Tests
        run: npm test

      - name: Build Project
        run: npm run build
