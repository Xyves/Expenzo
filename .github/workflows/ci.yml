name: CI Pipeline

on:
  push:
    branches:
      - main
      - '*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.9.0

      - name: Install dependencies
        run: npm install

      - name: Lint & Format
        run: |
          npm run lint
          npm run prettier

      - name: Type Check
        run: npm run check:types

      - name: Run Tests
        run: npm test

      - name: Build Project
        run: npm run build
